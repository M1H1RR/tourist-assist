  <rect x="35" y="22" width="2" height="2" fill="#2DD4BF"/>
  <rect x="57" y="20" width="6" height="6" rx="1" fill="none" stroke="#2DD4BF" stroke-width="1.2"/>
  <rect x="59" y="22" width="2" height="2" fill="#2DD4BF"/>
  <!-- Gold Temple Shikhara Motif -->
